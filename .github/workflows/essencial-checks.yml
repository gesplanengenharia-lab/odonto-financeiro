name: Verificação do Essencial Financeiro

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Executar testes
        run: npm test
      - name: Compilar aplicação
        run: npm run build
