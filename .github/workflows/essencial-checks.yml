name: Verificação do Essencial Financeiro

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.19.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile
      - name: Compilar e gerar rotas tipadas
        run: pnpm run build
      - name: Validar TypeScript
        run: pnpm exec tsc --noEmit
      - name: Executar testes
        run: pnpm test
      - name: Validar migrações em PostgreSQL isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/essencial-db-test" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.15
          PGLITE_MODULE="$RUNNER_TEMP/essencial-db-test/node_modules/@electric-sql/pglite" node scripts/verify-treasury-migration.cjs

